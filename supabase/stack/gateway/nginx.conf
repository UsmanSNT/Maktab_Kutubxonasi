# Mahalliy shlyuz: supabase-js /rest/v1 va /auth/v1 yo'llarini ishlatadi (Kong o'rniga oddiy nginx).
events {}

http {
  server {
    listen 8000;
    client_max_body_size 10m;

    location /rest/v1/ {
      proxy_pass http://rest:3000/;
      proxy_set_header Host $host;
    }

    location /auth/v1/ {
      proxy_pass http://auth:9999/;
      proxy_set_header Host $host;
    }

    location / {
      return 404;
    }
  }
}
